name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Every API route has a screen or a written reason (docs/ui-coverage.md, W7½ UI3).
      - run: pnpm check:ui-coverage
      - run: pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm test
      # Integration tests start Postgres with Testcontainers (Docker is preinstalled on the runner).
      - run: pnpm test:int
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      # The messages E2E needs delivery reports: a throwaway webhook secret shared by the API
      # and the fake WhatsApp provider (both read .env). Not a real Meta secret.
      - run: |
          echo "WHATSAPP_APP_SECRET=ci-only-webhook-secret-$GITHUB_RUN_ID" >> .env
          echo "WHATSAPP_VERIFY_TOKEN=ci-only-verify-token" >> .env

      # Postgres 5433 + Redis 6380, the same compose file developers use.
      - run: pnpm infra:up
      - run: pnpm db:migrate

      - run: pnpm --filter @shiftora/web exec playwright install --with-deps chromium

      # Build the workspace packages first: Playwright starts the two dev servers itself, and
      # they import @shiftora/shared, @shiftora/domain and @shiftora/db from their dist folders.
      - run: pnpm build

      # Playwright starts the API, the web app and the worker itself (CI=true turns off server
      # reuse) and waits for each one: the two servers at their readiness URLs, the worker for
      # its "relaying" line.
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
